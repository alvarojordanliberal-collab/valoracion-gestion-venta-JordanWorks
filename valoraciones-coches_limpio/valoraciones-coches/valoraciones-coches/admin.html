<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrar opiniones</title>
<style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#1b2630;background:#f5f7f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1080px;margin:auto;padding:30px 18px 70px}header{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}h1{font-size:clamp(26px,5vw,40px);margin:5px 0}.sub{color:#65727d}button,input{font:inherit}button{cursor:pointer;border-radius:10px;border:1px solid #d6dfe4;padding:11px 15px;background:white}button.primary{background:#166a67;border-color:#166a67;color:white;font-weight:700}button.danger{color:#a33b32}.card{background:white;border:1px solid #e4e9ed;border-radius:18px;padding:23px;box-shadow:0 8px 25px #1b26300a}.login{max-width:460px;margin:55px auto}.login label{display:block;font-size:14px;margin:16px 0 6px;font-weight:650}.login input{width:100%;padding:13px;border:1px solid #cdd6dd;border-radius:10px}.login button{width:100%;margin-top:20px}.hidden{display:none!important}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.toolbar button[aria-pressed=true]{background:#1b2630;color:white}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.head{display:flex;justify-content:space-between;gap:15px}.stars{color:#cc911b}.muted{color:#65727d;font-size:13px}.comment{line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.badge{background:#e8f1ef;color:#17635e;padding:5px 9px;border-radius:20px;font-size:12px}.badge.no{background:#fff1e5;color:#935316}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}details{margin-top:15px}summary{cursor:pointer;color:#166a67;font-weight:650}.answers{display:grid;grid-template-columns:minmax(100px,1fr) 1.5fr;gap:9px;margin-top:14px;font-size:14px}.answers dt{color:#65727d}.answers dd{margin:0;overflow-wrap:anywhere}.notice{padding:13px 0;color:#52616c;min-height:30px}#logout{white-space:nowrap}@media(max-width:700px){.grid{grid-template-columns:1fr}.card{padding:18px}}</style></head><body><main class="wrap">
<header><div><div class="sub">Gestión de venta de vehículos · Acceso privado</div><h1>Panel de valoraciones</h1></div><button id="logout" class="hidden">Cerrar sesión</button></header>
<section id="login" class="card login"><h2>Acceso administrador</h2><p class="sub">Entra con el usuario autorizado de Supabase Auth.</p><form id="loginForm"><label for="email">Correo electrónico</label><input id="email" type="email" autocomplete="username" required value="inigolibh7@gmail.com"><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required><button class="primary" type="submit">Entrar</button></form></section>
<section id="dashboard" class="hidden"><p class="sub" id="counts"></p><div class="toolbar"><button type="button" data-filter="pending" aria-pressed="true">Pendientes</button><button type="button" data-filter="published" aria-pressed="false">Publicadas</button><button type="button" data-filter="all" aria-pressed="false">Todas</button><button type="button" id="reload">Actualizar</button></div><div class="grid" id="items"></div></section><p id="status" class="notice" role="status" aria-live="polite"></p>
</main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const fields=[['profesionalidad','Profesionalidad'],['comunicacion','Comunicación'],['fotografias','Fotografías'],['anuncio','Anuncio'],['gestion_interesados','Gestión de interesados'],['visitas_negociacion','Visitas y negociación'],['mas_valorado','Lo más valorado'],['ahorro_tiempo','Ahorro de tiempo'],['mejor_resultado','Mejor resultado'],['volveria','¿Volvería a contratar?'],['recomendaria','¿Lo recomendaría?'],['aspecto_mejorar','Aspectos a mejorar']];let client,rows=[],filter='pending';
const status=t=>$('status').textContent=t;const show=ok=>{$('login').classList.toggle('hidden',ok);$('dashboard').classList.toggle('hidden',!ok);$('logout').classList.toggle('hidden',!ok)};
function make(tag,content,cls){const el=document.createElement(tag);if(content!=null)el.textContent=String(content);if(cls)el.className=cls;return el}
function render(){const pending=rows.filter(r=>!r.publicado).length,pub=rows.filter(r=>r.publicado).length;$('counts').textContent=`${pending} pendientes · ${pub} publicadas · ${rows.length} recibidas`;$('items').replaceChildren();const shown=rows.filter(r=>filter==='all'||(filter==='pending'?!r.publicado:r.publicado));if(!shown.length)$('items').append(make('p','No hay valoraciones en esta sección.','sub'));
for(const r of shown){const card=make('article',null,'card');const head=make('div',null,'head');const h=make('div');h.append(make('strong',r.nombre||'Cliente anónimo'),make('div','★'.repeat(r.estrellas)+'☆'.repeat(5-r.estrellas),'stars'));const meta=make('div');meta.append(make('div',new Date(r.created_at).toLocaleDateString('es-ES'),'muted'),make('span',r.publicado?'Publicada':'Pendiente','badge'+(r.publicado?'':' no')));head.append(h,meta);card.append(head,make('p',r.comentario||'Sin comentario.','comment'));
const consent=make('p',`Publicación: ${r.autoriza_publicacion?'Autorizada':'No autorizada'} · Detalles: ${r.autoriza_detalles?'Autorizados':'No autorizados'}`,'muted');card.append(consent);
const detail=make('details');detail.append(make('summary','Ver respuestas completas (solo administración)'));const dl=make('dl',null,'answers');for(const [key,label] of [...fields,['email','Email (privado)']]){if(r[key]!==null&&r[key]!==undefined&&String(r[key]).trim()){dl.append(make('dt',label),make('dd',r[key]));}}detail.append(dl);card.append(detail);
const actions=make('div',null,'actions');const btn=make('button',r.publicado?'Retirar publicación':'Publicar',r.publicado?'danger':'primary');btn.disabled=!r.publicado&&!r.autoriza_publicacion;btn.title=btn.disabled?'El cliente no autorizó publicar esta opinión':'';btn.addEventListener('click',async()=>{btn.disabled=true;status('Guardando...');const {error}=await client.from('valoraciones_recibidas').update({publicado:!r.publicado}).eq('id',r.id);if(error){status('Error al guardar: '+error.message);btn.disabled=false;return;}status('Cambio guardado.');await load();});actions.append(btn);card.append(actions);$('items').append(card);}}
async function load(){status('Cargando valoraciones...');const {data,error}=await client.from('valoraciones_recibidas').select('*').order('created_at',{ascending:false}).limit(1000);if(error){status('No se pueden consultar las valoraciones: '+error.message);return;}rows=data||[];render();status('');}
async function check(){const {data:{user}}=await client.auth.getUser();if(!user){show(false);return;}const {data,error}=await client.from('administradores_valoraciones').select('user_id').eq('user_id',user.id).maybeSingle();if(error||!data){await client.auth.signOut();show(false);status('Este usuario no tiene permisos de administración.');return;}show(true);await load();}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();status('Iniciando sesión...');const {error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('password').value='';if(error){status('No se pudo iniciar sesión: '+error.message);return;}await check();});$('logout').addEventListener('click',async()=>{await client.auth.signOut();rows=[];show(false);status('Sesión cerrada.');});$('reload').addEventListener('click',load);document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render();}));
if(!window.SUPABASE_URL||!window.SUPABASE_ANON_KEY||!window.supabase){status('Falta configurar Supabase o cargar su librería.');return;}client=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);check().catch(e=>status('Error de conexión: '+e.message));})();
</script></body></html>
